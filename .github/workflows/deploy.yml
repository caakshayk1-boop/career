# Deploy career.askakshay.com, then check the page a browser actually renders.
#
# This site had no CI at all: every change went live only when somebody ran
# `npx wrangler deploy` from a laptop, which is the same gap that left
# signal.askakshay.com serving 33-hour-old data while every workflow was green.
#
# The podcast pipeline's unit suite runs here too — it needs no credentials and
# no network, so there is no reason for it to live anywhere else.
#
# THE TOKEN IS REQUIRED, NOT OPTIONAL. signal.askakshay.com carried a gate that
# skipped the deploy when the secret was missing and reported success — thirteen
# green runs that published nothing. A deploy step that cannot deploy has
# failed, so this exits 1 and names the command that fixes it.
name: deploy

on:
  push:
    branches: [main]
    paths-ignore: ["**/*.md"]

  # THE MORNING JOB'S COMMIT DOES NOT TRIGGER THE PUSH EVENT ABOVE. GitHub
  # deliberately suppresses workflow triggers for pushes made with the default
  # GITHUB_TOKEN, to stop a workflow that commits from re-triggering itself
  # forever. Without this block the podcast job would commit new points every
  # morning and the live site would never change — silently, and for as long as
  # nobody happened to compare the repo against the page.
  #
  # workflow_run fires on the completion of a named workflow instead, and is
  # exempt from that rule. On a morning with nothing new the podcast job commits
  # nothing and this redeploys identical assets, which costs ~90 seconds and
  # changes nothing at the edge — cheaper than the alternative, which is a page
  # that quietly stops updating.
  # books commits with the same GITHUB_TOKEN, so it needs naming here for the
  # same reason — otherwise the weekly read lands in the repo on Monday night
  # and the live page keeps serving last week's until the next unrelated push.
  workflow_run:
    workflows: [podcasts, books]
    types: [completed]

  workflow_dispatch:

# CANCEL-IN-PROGRESS WAS WRONG HERE, AND IT COST A DEPLOY ON ITS FIRST DAY.
# The books job was dispatched 12 seconds after a push. Its workflow_run deploy
# claimed this group, cancelled the push deploy that was already uploading, and
# was then itself skipped by the `if` below because the books run had failed.
# Net effect: a green-looking repo, two deploy runs, and nothing published.
#
# A cancelling group only pays for itself when a later run supersedes an earlier
# one. These runs check out `main` by name, so every deploy ships the same tree
# whichever order they run in — superseding buys nothing, and a serialized
# queue cannot cancel a live upload.
concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    # A failed podcast run has nothing new to publish, and deploying after one
    # would overwrite nothing while reporting success.
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    steps:
      # workflow_run starts from the ref that triggered it, which for a run
      # begun before the commit is the ref WITHOUT it. Check out main by name so
      # the deploy always ships the artifact the job just wrote.
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with: { node-version: "22" }

      - name: Require a Cloudflare token
        run: |
          if [ -z "${{ secrets.CLOUDFLARE_API_TOKEN }}" ]; then
            echo "::error::CLOUDFLARE_API_TOKEN not set — this push has NOT been deployed."
            echo "  gh secret set CLOUDFLARE_API_TOKEN  --repo caakshayk1-boop/career"
            echo "  gh secret set CLOUDFLARE_ACCOUNT_ID --repo caakshayk1-boop/career"
            exit 1
          fi

      - run: npm install --no-audit --no-fund

      # The pipeline's own suite: offline, no keys, ~2 seconds. It runs BEFORE
      # the deploy because public/podcasts.json is a deployed asset and the
      # suite asserts its shape — a malformed artifact would otherwise reach the
      # edge and leave the page rendering its error state.
      - name: Test the podcast pipeline
        run: npm run podcasts:test

      - name: Deploy the Worker
        run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}

      # The check is the point. Everything on this page is one inline script,
      # so a single syntax error leaves a page that still looks finished — which
      # is exactly how a broken deploy survives a green build.
      - name: Check the rendered page
        run: |
          npm install --no-save playwright@1.62.1
          npx playwright install chromium --with-deps
          node scripts/check.mjs "${{ vars.CAREER_URL || 'https://career.askakshay.com' }}"
